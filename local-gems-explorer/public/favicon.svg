<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer circle background -->
  <circle cx="32" cy="32" r="32" fill="#1a6b52"/>

  <!-- Compass ring -->
  <circle cx="32" cy="32" r="22" stroke="#f0ebe0" stroke-width="2.5" fill="none"/>

  <!-- Compass needle — North (accent gold) -->
  <polygon points="32,12 29,32 32,29 35,32" fill="#e8a020"/>
  <!-- Compass needle — South (white) -->
  <polygon points="32,52 29,32 32,35 35,32" fill="#f0ebe0" opacity="0.7"/>

  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#f0ebe0"/>

  <!-- Cardinal tick marks -->
  <line x1="32" y1="10" x2="32" y2="14" stroke="#f0ebe0" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="54" stroke="#f0ebe0" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="14" y2="32" stroke="#f0ebe0" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="54" y2="32" stroke="#f0ebe0" stroke-width="2" stroke-linecap="round"/>
</svg>
